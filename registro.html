<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ZONALIBROS</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>

    <header class="header">
        <a class="logo" href="index.html">ZONALIBROS</a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main class="pagina-formulario">

        <section class="formulario-contenedor formulario-grande">

            <h1>Registro de usuario</h1>

            <form id="registroForm">

                <label for="nombre">Nombre completo</label>

                <input
                    type="text"
                    id="nombre"
                    maxlength="100"
                    autocomplete="name"
                    required>

                <span id="errorNombre" class="error"></span>

                <label for="correo">Correo electrónico</label>

                <input
                    type="email"
                    id="correo"
                    maxlength="60"
                    placeholder="usuario@duoc.cl"
                    autocomplete="email"
                    required>

                <span id="errorCorreo" class="error"></span>

                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    required>

                <span id="errorPassword" class="error"></span>

                <label for="confirmarPassword">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmarPassword"
                    autocomplete="new-password"
                    required>

                <span id="errorConfirmar" class="error"></span>

                <label for="telefono">Teléfono opcional</label>

                <input
                    type="tel"
                    id="telefono"
                    autocomplete="tel">

                <span id="errorTelefono" class="error"></span>

                <fieldset>

                    <legend>Temáticas favoritas</legend>

                    <label>
                        <input
                            type="checkbox"
                            name="genero"
                            value="Grecia Antigua">
                        Grecia Antigua
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="genero"
                            value="Roma Antigua">
                        Roma Antigua
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="genero"
                            value="Mitología">
                        Mitología
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="genero"
                            value="Filosofía">
                        Filosofía
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="genero"
                            value="Egipto Antiguo">
                        Egipto Antiguo
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="genero"
                            value="Historia Militar">
                        Historia Militar
                    </label>

                </fieldset>

                <span id="errorGenero" class="error"></span>

                <button type="submit">Registrarse</button>

                <p id="mensajeRegistro" class="mensaje"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>ZONALIBROS</p>
    </footer>

</body>

</html>
